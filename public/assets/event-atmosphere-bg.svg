      <stop offset="48%" stop-color="#ffc68b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffc68b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRed" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f31822" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f31822" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f31822" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur">
