<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1600" viewBox="0 0 1920 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f31822" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#7e1716" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="18%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#ffc68b" stop-opacity="0.28"/>
      <stop offset="54%" stop-color="#ffc68b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="88%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#f31822" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#7e1716" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stageFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#09090d" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#09090d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0.96"/>
